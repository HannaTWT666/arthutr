<!doctype html><html lang="pt-BR"><head><title>Mural do Arthur</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><nav><a class="logo" href="index.html">Arthur <b>Ramos</b></a><ul><li><a class="l" href="index.html">Início</a></li><li><a class="l" href="sobre.html">Quem é</a></li><li><a class="l" href="trajetoria.html">Trajetória</a></li><li><a class="l" href="galeria.html">Galeria</a></li><li><a class="l" href="quiz.html">Quiz</a></li><li><a class="l" href="voto.html">O voto</a></li><li><a class="l on" href="mural.html">Mural</a></li></ul></nav><section><div class="wrap"><h2>Mural de recados</h2><p>Deixe um recado para o Arthur. Ele aparece aqui na hora (some ao fechar a página).</p>
<form class="form" id="f"><input id="t" maxlength="120" placeholder="Escreva seu recado" aria-label="Recado"><button class="btn" type="submit">Colar no mural</button></form>
<div class="mural" id="m"><div class="nota">Bem-vindo ao mural do Arthur!</div></div></div></section><footer>Feito com carinho para o <b>Arthur</b>. Voto é pessoal, opinião também.</footer><script>
const f=document.getElementById("f"),t=document.getElementById("t"),m=document.getElementById("m");
f.onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(!v)return;const d=document.createElement("div");d.className="nota";d.textContent=v;m.prepend(d);t.value=""}
</script></body></html>
